name: Build index pages

# docs/index.html and docs/ios/index.html are generated from docs/projects.json
# by scripts/build_site.py. Editing the data without running the build would
# leave the published pages stale, which is exactly the drift this replaced, so
# CI rebuilds and commits the output whenever the inputs change.

on:
  schedule:
    - cron: "15 12 * * *"
  push:
    branches: [main]
    paths:
      - docs/projects.json
      - docs/ios/**
      - scripts/build_site.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so sitemap.xml lastmod dates come from real commits.
          fetch-depth: 0

      - name: Generate index pages
        run: python3 scripts/build_site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/projects.json docs/index.html docs/ios/index.html docs/guides/index.html docs/assets/github-contributions.svg \
            docs/sitemap.xml docs/robots.txt docs/llms.txt
          if git diff --cached --quiet; then
            echo "Index pages already up to date."
            exit 0
          fi
          git commit -m "chore: rebuild index pages from projects.json"
          # App mirror pushes land concurrently; rebase onto them and retry.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
