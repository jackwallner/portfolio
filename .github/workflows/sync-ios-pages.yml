name: Sync iOS landing pages

# Mirrors each app's landing page from its own repo into docs/ios/<slug>/ so
# they are served from https://jackwallner.com/ios/<slug>/ as real pages.
# GitHub Pages cannot proxy, so the files have to live here.

# Not scheduled. Each app repo pushes its own page here on change (see its
# .github/workflows/sync-landing-page.yml), so polling would only ever find
# work that has already been done. This is the whole-fleet resync: use it
# after adding an app to the APPS dict, or to repair drift.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [app-page-updated]

permissions:
  contents: write

concurrency:
  group: sync-ios-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror app landing pages
        run: python3 scripts/sync_ios_pages.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ios
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No landing-page changes."
            exit 0
          fi
          git commit -m "chore: sync iOS landing pages

          $(git diff --cached --name-only | cut -d/ -f3 | sort -u | tr '\n' ' ')"
          # The push itself triggers pages-build-deployment, even from
          # GITHUB_TOKEN. Requesting a build explicitly on top of that just
          # races the automatic one and leaves a spurious failed build.
          # App repos push their own mirrors here all the time. If one lands
          # first, start over from it: re-mirroring is cheaper than resolving
          # a rebase conflict in a file both sides rewrote.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected, re-mirroring on top of origin (attempt $attempt)."
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 scripts/sync_ios_pages.py
            git add docs/ios
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: sync iOS landing pages"
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
