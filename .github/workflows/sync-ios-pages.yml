name: Sync iOS landing pages

# Mirrors each app's landing page from its own repo into docs/ios/<slug>/ so
# they are served from https://jackwallner.com/ios/<slug>/ as real pages.
# GitHub Pages cannot proxy, so the files have to live here.

on:
  schedule:
    # Hourly, off the top of the hour to dodge the cron rush.
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [app-page-updated]

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-ios-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror app landing pages
        run: python3 scripts/sync_ios_pages.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ios
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No landing-page changes."
            exit 0
          fi
          git commit -m "chore: sync iOS landing pages

          $(git diff --cached --name-only | cut -d/ -f3 | sort -u | tr '\n' ' ')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
