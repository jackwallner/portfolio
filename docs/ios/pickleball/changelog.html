      :root {
        color-scheme: light dark;
        --ink: #111827;
        --muted: #4b5563;
        --line: #e5e7eb;
        --accent: #0f766e;
        --bg: #ffffff;
        --panel: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f3f4f6;
          --muted: #9ca3af;
          --line: #374151;
          --accent: #5eead4;
          --bg: #0b0f19;
          --panel: #111827;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.65 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .wrap {
        max-width: 52rem;
        margin: 0 auto;
        padding: 3.5rem 1.25rem 5rem;
      }
      h1 {
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        line-height: 1.15;
        margin: 0 0 0.6rem;
        letter-spacing: -0.02em;
      }
      .lede {
        font-size: 1.15rem;
        color: var(--muted);
        margin: 0 0 2rem;
      }
      h2 {
        font-size: 1.15rem;
        margin: 2.5rem 0 0.5rem;
      }
      p {
        margin: 0.6rem 0;
      }
      .grid {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        margin-top: 1.5rem;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.1rem 1.2rem;
      }
      .card h3, .card h2 {
        margin: 0 0 0.35rem;
        font-size: 1rem;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.09em;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--accent);
        margin: 0 0 0.5rem;
      }
      footer {
        margin-top: 4rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }
      a {
        color: var(--accent);
      }
      .note {
        font-size: 0.88rem;
        color: var(--muted);
        border-left: 3px solid var(--line);
        padding-left: 1rem;
        margin-top: 2.5rem;
      }

      /* The product is a picture of a court and a decision, so the page has to
     show one. Everything here is inline SVG: no external assets, no CDN, and
     it renders identically in both colour schemes. */
      .demo {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: minmax(11rem, 15rem) 1fr;
        align-items: start;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 1.25rem;
        margin-top: 2rem;
      }
      @media (max-width: 34rem) {
        .demo {
          grid-template-columns: 1fr;
        }
      }
      .demo svg {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }
      .options {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.5rem;
      }
      .options li {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.55rem 0.75rem;
        font-size: 0.95rem;
        background: var(--bg);
      }
      .options li.right {
        border-color: var(--accent);
      }
      .options li .tick {
        color: var(--accent);
        font-weight: 800;
      }
      .why {
        margin-top: 0.9rem;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .why strong {
        color: var(--ink);
      }
      .cta {
        margin-top: 2rem;
        padding: 1.1rem 1.2rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }
      .cta p {
        margin: 0;
      }
      .cta .big {
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--ink);
      }
      .faq details { border-top:1px solid var(--line); padding:.85rem 0; }
      .faq details:last-child { border-bottom:1px solid var(--line); }
      .faq summary { cursor:pointer; font-weight:600; list-style:none; position:relative; padding-right:1.5rem; }
      .faq summary::-webkit-details-marker { display:none; }
      .faq summary::after { content:"+"; position:absolute; right:.25rem; color:var(--muted); font-weight:400; }
      .faq details[open] summary::after { content:"\2212"; }
      .faq details p { margin:.5rem 0 0; color:var(--muted); }
            summary > h2.faq-q { display: inline; margin: 0; font: inherit; letter-spacing: inherit; color: inherit; }
